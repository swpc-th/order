<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า สภาวิชาชีพสังคมสงเคราะห์</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #F6F5F1;
    }
    #appFrame {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* ข้อความเตือนกรณียังไม่ได้ใส่ลิงก์เว็บแอป */
    #setupNotice {
      display: none;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      max-width: 560px;
      margin: 60px auto;
      padding: 20px 24px;
      background: #fff;
      border: 1px solid #E1E4DF;
      border-radius: 12px;
      color: #16231F;
      line-height: 1.6;
    }
    #setupNotice code {
      background: #F6F5F1;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!--
    ============================================================
    วิธีใช้งาน:
    1) เปิด Google Sheet ของระบบสั่งซื้อ -> เมนู "🛒 ระบบสั่งซื้อสินค้า"
       -> "🌐 ดูลิงก์เว็บสั่งซื้อ (สำหรับแจกสมาชิก)" เพื่อคัดลอกลิงก์เว็บแอป
       (ต้องกด Deploy เว็บแอปที่ Apps Script Editor ก่อน 1 ครั้ง)
    2) นำลิงก์ที่ได้ (รูปแบบ https://script.google.com/macros/s/XXXXXXXXXXXXX/exec)
       มาแทนที่ค่า WEB_APP_URL ด้านล่างนี้
    3) บันทึกไฟล์นี้เป็น index.html แล้วอัปโหลดขึ้น GitHub repo ที่เปิดใช้ GitHub Pages
    4) URL ของ GitHub Pages (เช่น https://ชื่อผู้ใช้.github.io/ชื่อ-repo/) จะเป็นลิงก์
       ที่เอาไปแจกสมาชิกได้ — เนื้อหาข้างในยังคงรันจริงบน Google Apps Script เหมือนเดิม
    ============================================================
  -->

  <div id="setupNotice">
    <h3>⚠️ ยังไม่ได้ตั้งค่าลิงก์เว็บแอป</h3>
    <p>
      กรุณาแก้ไขไฟล์ <code>index.html</code> นี้ แล้วแทนที่ค่าตัวแปร
      <code>WEB_APP_URL</code> ในส่วน <code>&lt;script&gt;</code> ด้านล่าง
      ด้วยลิงก์เว็บแอปที่ได้จากเมนู "🌐 ดูลิงก์เว็บสั่งซื้อ" ในสเปรดชีต
    </p>
  </div>

  <iframe id="appFrame" title="สั่งซื้อสินค้า สภาวิชาชีพสังคมสงเคราะห์"></iframe>

  <script>
    // 🔧 แก้ตรงนี้: ใส่ลิงก์เว็บแอปที่ deploy แล้วจาก Apps Script
    var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxhLE-VbbOXep2Jf5lrzESjqbVbN9CyWw7qAcxc9yExXGUifEGpmEEjnCgjpxGRlp_d/exec
";

    if (!WEB_APP_URL || WEB_APP_URL.indexOf("XXXXXXX") !== -1) {
      document.getElementById('setupNotice').style.display = 'block';
      document.getElementById('appFrame').style.display = 'none';
    } else {
      document.getElementById('appFrame').src = WEB_APP_URL;
    }
  </script>

</body>
</html>
