<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า สภาวิชาชีพสังคมสงเคราะห์</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #F6F5F1;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #16231F;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      max-width: 420px;
      text-align: center;
      padding: 32px 24px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #E1E4DF;
      border-top-color: #1D6F64;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a.manual-link {
      color: #1D6F64;
      word-break: break-all;
    }
    #setupNotice {
      display: none;
      text-align: left;
      background: #fff;
      border: 1px solid #E1E4DF;
      border-radius: 12px;
      padding: 20px 24px;
      line-height: 1.6;
    }
    #setupNotice code {
      background: #F6F5F1;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!--
    ============================================================
    ⚠️ หมายเหตุสำคัญ: หน้านี้ "เด้งไปหน้าเว็บแอป" แทนการฝัง iframe
    เพราะสคริปต์ระบบสั่งซื้อใช้สิทธิ์ Google Drive แบบเต็มรูปแบบ
    (สร้างโฟลเดอร์ / อัปโหลดไฟล์รูปสินค้าและสลิป) ซึ่ง Google บังคับ
    ไม่ให้ฝังเว็บแอปประเภทนี้ผ่าน iframe ได้ (กันการหลอกขโมยสิทธิ์)
    จึงต้องใช้วิธี redirect แทน — URL ของ GitHub Pages ยังใช้แจกได้ปกติ
    เพียงแต่พอเปิดแล้ว URL bar จะเปลี่ยนเป็นลิงก์ script.google.com

    วิธีตั้งค่า:
    1) เปิด Google Sheet ของระบบสั่งซื้อ -> เมนู "🛒 ระบบสั่งซื้อสินค้า"
       -> "🌐 ดูลิงก์เว็บสั่งซื้อ (สำหรับแจกสมาชิก)" เพื่อคัดลอกลิงก์เว็บแอป
    2) นำลิงก์ที่ได้มาแทนที่ค่า WEB_APP_URL ในส่วน <script> ด้านล่าง
    3) บันทึกไฟล์นี้เป็น index.html แล้วอัปโหลดขึ้น GitHub repo ที่เปิด GitHub Pages
    ============================================================
  -->

  <div class="box" id="loadingBox">
    <div class="spinner"></div>
    <div>กำลังพาไปหน้าสั่งซื้อสินค้า...</div>
    <div style="margin-top:10px;font-size:12.5px;color:#6B7A74;">
      หากไม่เด้งไปอัตโนมัติ กดลิงก์นี้:
      <br><a class="manual-link" id="manualLink" href="#">เปิดหน้าสั่งซื้อ</a>
    </div>
  </div>

  <div class="box" id="setupNotice">
    <h3>⚠️ ยังไม่ได้ตั้งค่าลิงก์เว็บแอป</h3>
    <p>
      กรุณาแก้ไขไฟล์ <code>index.html</code> นี้ แล้วแทนที่ค่าตัวแปร
      <code>WEB_APP_URL</code> ในส่วน <code>&lt;script&gt;</code> ด้านล่าง
      ด้วยลิงก์เว็บแอปที่ได้จากเมนู "🌐 ดูลิงก์เว็บสั่งซื้อ" ในสเปรดชีต
    </p>
  </div>

  <script>
    // 🔧 แก้ตรงนี้: ใส่ลิงก์เว็บแอปที่ deploy แล้วจาก Apps Script
    var WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxhLE-VbbOXep2Jf5lrzESjqbVbN9CyWw7qAcxc9yExXGUifEGpmEEjnCgjpxGRlp_d/exec";

    if (!WEB_APP_URL || WEB_APP_URL.indexOf("XXXXXXX") !== -1) {
      document.getElementById('setupNotice').style.display = 'block';
      document.getElementById('loadingBox').style.display = 'none';
    } else {
      document.getElementById('manualLink').href = WEB_APP_URL;
      // เด้งไปหน้าเว็บแอปทันที (แทนที่ประวัติ ไม่ให้กดย้อนกลับมาหน้าว่างนี้)
      window.location.replace(WEB_APP_URL);
    }
  </script>

</body>
</html>
